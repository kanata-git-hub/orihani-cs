name: Joint review of synthetic clinic messages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/joint-smoke.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: cs-joint-review-20261104-final
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check synthetic fixed and joint-review messages
        run: node tests/run-joint-smoke.mjs
