name: Release sample of two synthetic patient messages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-sample.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: cs-release-sample-20261104
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate two fixed synthetic examples with the release code
        run: node tests/run-release-sample.mjs
