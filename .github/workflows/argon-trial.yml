name: CS synthetic Argon trial
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/argon-trial.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: cs-argon-trial-v1
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review thirteen fixed synthetic cases with the deployed revision
        run: node tests/run-argon-trial.mjs
